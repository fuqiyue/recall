name: Pull Request

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]

jobs:
  pr-checks:
    name: PR 检查
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 设置 Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 验证 Recall 一致性
      run: |
        chmod +x recall.sh
        ./recall.sh validate

    - name: 检查 Commit Message 格式
      run: |
        # 获取 PR 中的所有 commit
        commits=$(git log origin/main..HEAD --pretty=format:"%s")

        # 检查是否符合 Conventional Commits
        echo "$commits" | while IFS= read -r msg; do
          if ! echo "$msg" | grep -qE "^(feat|fix|docs|style|refactor|test|chore)(\(.+\))?: .+"; then
            echo "⚠️ Commit message 不符合规范: $msg"
            echo "请使用格式: <type>: <description>"
            echo "type 可以是: feat, fix, docs, style, refactor, test, chore"
          fi
        done

    - name: 检查 logic 文档随代码更新（docs_impact 提示）
      run: |
        # CHANGELOG.md 已于 2026-08-16 归档；变更历史由 logic_version/ 与 logic_readme.md 承载
        if git diff --name-only origin/main...HEAD | grep -qE "^(scripts/|recall\.(bat|sh))"; then
          if ! git diff --name-only origin/main...HEAD | grep -qE "^(logic_readme\.md|logic_domains/|logic_version/)"; then
            echo "⚠️ 提示: 脚本/入口变更未触及 logic_readme.md、logic_domains/ 或 logic_version/，请确认 docs_impact 为 none 有理由"
          fi
        fi

    - name: 文件大小检查
      run: |
        # 检查是否有超大文件（防止意外提交）
        large_files=$(find . -type f -size +1M -not -path "./.git/*" -not -path "./logic_version/*")
        if [ -n "$large_files" ]; then
          echo "⚠️ 发现大文件（>1MB）："
          echo "$large_files"
          echo "请确认这些文件应该被提交"
        fi

    - name: 检查敏感信息
      run: |
        # 基础检查：防止提交密钥、密码等
        if git diff origin/main...HEAD | grep -iE "(password|secret|api[_-]?key|token|private[_-]?key).*=.*['\"]"; then
          echo "❌ 警告: 可能包含敏感信息！"
          echo "请检查提交内容，移除任何密钥、密码或令牌"
          exit 1
        fi

  label-pr:
    name: 自动标记 PR
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 根据文件变化添加标签
      uses: actions/labeler@v5
      with:
        repo-token: "${{ secrets.GITHUB_TOKEN }}"
