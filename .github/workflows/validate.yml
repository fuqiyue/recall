name: Recall Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: 验证 Recall 一致性
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # 需要完整历史以验证 Git 集成

    - name: 设置 Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 运行 Recall 验证
      run: |
        chmod +x recall.sh
        ./recall.sh validate

    - name: 运行逻辑地图测试
      run: python tests/test_audit_logic_map.py

    - name: 运行 CLI / 校验 / 公共模块 / Git 自动同步测试
      run: python -m unittest tests.test_git_sync tests.test_recall_cli tests.test_validate tests.test_recall_common

    - name: 审计静态门（current-state）
      run: python scripts/audit_logic_map.py . --current-state

    - name: 检查文档一致性
      run: |
        # 验证必要文件存在
        test -f logic_readme.md || (echo "❌ logic_readme.md 缺失" && exit 1)
        test -f logic_change.md || (echo "❌ logic_change.md 缺失" && exit 1)
        test -d logic_version || (echo "❌ logic_version/ 目录缺失" && exit 1)

        # 验证代码地图章节存在（表头曾叫 Code Map，2026-08 起为"代码地图"）
        grep -q "## 代码地图" logic_readme.md || (echo "❌ logic_readme.md 缺少「代码地图」章节" && exit 1)

        echo "✅ 文档结构完整"
