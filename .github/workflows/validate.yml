name: Recall Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: 验证 Recall 一致性
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # 需要完整历史以验证 Git 集成

    - name: 设置 Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 运行 Recall 验证
      run: |
        chmod +x recall.sh
        ./recall.sh validate

    - name: 运行全部测试（新增测试文件自动纳入）
      run: python -m unittest discover -s tests

    - name: 审计静态门（current-state）
      run: python scripts/audit_logic_map.py . --current-state

    - name: 冲突检测（退出码 2 = 有待裁决的潜在冲突，只提示不阻断）
      run: |
        code=0
        python scripts/recall.py conflicts || code=$?
        if [ "$code" -eq 2 ]; then echo "⚠️ 检出潜在冲突，请在会话中按 FLOW-004 裁决"; exit 0; fi
        exit "$code"

    - name: 检查文档一致性
      run: |
        # 验证必要文件存在
        test -f logic_readme.md || (echo "❌ logic_readme.md 缺失" && exit 1)
        test -f logic_change.md || (echo "❌ logic_change.md 缺失" && exit 1)
        test -d logic_version || (echo "❌ logic_version/ 目录缺失" && exit 1)

        # 验证代码地图章节存在（表头曾叫 Code Map，2026-08 起为"代码地图"）
        grep -q "## 代码地图" logic_readme.md || (echo "❌ logic_readme.md 缺少「代码地图」章节" && exit 1)

        echo "✅ 文档结构完整"
